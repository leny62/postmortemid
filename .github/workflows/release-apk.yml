name: release-apk

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed build" >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=postmortemid
          keyPassword=$KEYSTORE_PASSWORD
          PROPS
      - run: flutter pub get
      - run: flutter test
      - name: Build
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --build-name "${GITHUB_REF_NAME#v}" --build-number "${{ github.run_number }}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "postmortemid-${GITHUB_REF_NAME}-arm64.apk"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "postmortemid-${GITHUB_REF_NAME}-arm64.apk" \
            --title "PostMortemID $GITHUB_REF_NAME" --generate-notes --prerelease
