[project]
name = "postmortemid"
version = "0.1.0"
description = "Muzzle biometric verification research pipeline for the PostMortemID capstone"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pillow>=11.0",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "torch>=2.6",
    "torchvision>=0.21",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
    "nbconvert>=7.16",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ml/src/postmortemid"]

[tool.pytest.ini_options]
testpaths = ["ml/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pyright]
include = ["ml/src", "ml/scripts", "ml/tests"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
# pandas and OpenCV stubs return broad unions for ordinary indexing; keep these visible as warnings.
reportArgumentType = "warning"
reportAttributeAccessIssue = "warning"

[tool.ruff.lint.isort]
known-first-party = ["postmortemid"]

[tool.ruff.lint.per-file-ignores]
# Plotting and table cells read better on one line; the package code keeps the limit.
"*.ipynb" = ["E501"]
